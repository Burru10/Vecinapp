{% extends 'Vecinapp/base.html' %}
{% load static %}
{% block content %}

<style>
    .bandeja-full {
        height: 100vh;
        padding-top: 110px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        background: #f0f2f5;
        padding-bottom: 20px;
    }

    .bandeja-container {
        width: 100%;
        max-width: 700px;
        height: 100%;
        background: #ffffff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
    }

    .lista-usuarios {
        overflow-y: auto;
        flex: 1;
        margin-top: 10px;
        padding-right: 5px;
    }

    /* Barra scroll personalizada */
    .lista-usuarios::-webkit-scrollbar {
        width: 8px;
    }

    .lista-usuarios::-webkit-scrollbar-thumb {
        background-color: #ced4da;
        border-radius: 4px;
    }

    .usuario-chat {
        border-radius: 8px;
        padding: 12px 18px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .usuario-chat:hover {
        background-color: #f1f1f1;
        text-decoration: none;
    }

    .avatar {
        width: 45px;
        height: 45px;
        background: #dee2e6;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.1rem;
        color: #495057;
        margin-right: 15px;
        flex-shrink: 0;
    }

    .mensaje-preview {
        font-size: 0.9rem;
        color: #6c757d;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 250px;
    }

    .hora-msg {
        font-size: 0.75rem;
        color: #999;
        text-align: right;
    }

    .notificacion {
        background: #128c7e;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 12px;
        margin-top: 5px;
        text-align: center;
        display: inline-block;
        min-width: 22px;
    }
</style>

<div class="bandeja-full">
    <div class="bandeja-container">
        <div class="d-flex">
            <a href="{% url 'mi_comunidad' comunidad.id %}" class="me-3 text-dark"><i class="bi-arrow-left"></i></a>
            <h4 class="mb-3">Conversaciones en {{ comunidad.nombre }}</h4>
        </div>
        <div class="lista-usuarios" id="contenedor-bandeja">
            {% include 'interaccion/bandeja_ajax.html' %}
        </div>
    </div>
</div>

<script>
    function actualizarBandeja() {
        fetch("{% url 'actualizar_bandeja' comunidad.id %}", {
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
            .then(r => r.json())
            .then(data => {
                document.getElementById("contenedor-bandeja").innerHTML = data.html;
            });
    }

    setInterval(actualizarBandeja, 5000);
</script>

{% endblock %}
