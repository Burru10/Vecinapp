{% extends 'Vecinapp/base.html' %}
{% load static %}
{% block content %}
<style>
.btn-action {
    display: inline-block;
    background-color: #27c4c4;
    color: white;
    font-weight: 500;
    border-radius: 50px;
    padding: 15px 30px;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.3s ease;
    margin-top: 30px;
}

.btn-action:hover {
    background-color: #1ea8a8;
    transform: scale(1.05);
}
</style>

<section class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 125px); padding-top:125px; padding-bottom:80px;">
  <div class="text-center px-3">
    <h2 class="mb-4">Bienvenido a Vecinapp</h2>
    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
      <a href="{% url 'crear_comunidad' %}" class="btn-action" role="button">Crear Comunidad</a>
      <a href="{% url 'buscar_comunidades' %}" class="btn-action" role="button">Ingresar en una Comunidad</a>
    </div>
  </div>
</section>
{% endblock %}
