{% extends 'Vecinapp/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block head %}
  {{ block.super }}
  <style>
    .card-header {
      background: linear-gradient(90deg, #27c4c4, #1ea8a8);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .form-label {
      font-size: 1.1rem;
      font-weight: 500;
      color: #333;
    }
    .form-control:focus, .form-select:focus {
      border-color: #27c4c4;
      box-shadow: 0 0 0 .2rem rgba(39,196,196,.25);
    }
    .btn-lg-pill {
      padding: .75rem 1.5rem;
      border-radius: 50px;
      font-size: 1rem;
    }
  </style>
{% endblock %}

{% block content %}
<div class="container" style="padding-top: 130px; margin-bottom: 75px;">
  <div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-header text-center">
      Editar Tarea: {{ tarea.categoria.nombre }}
    </div>
    <div class="card-body">
      <form method="POST" novalidate>
        {% csrf_token %}

        {{ form.categoria|as_crispy_field }}

        <div class="form-floating mb-4">
          {{ form.descripcion }}
          <label for="{{ form.descripcion.id_for_label }}">Descripción</label>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
          <button type="submit"
                  class="btn btn-primary btn-lg-pill w-100 w-md-auto">
            Guardar Cambios
          </button>
          <a href="{% url 'ver_tarea' tarea.id %}"
             class="btn btn-outline-secondary btn-lg-pill w-100 w-md-auto">
            Cancelar
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
