{% extends 'Vecinapp/base.html' %}
{% load static %}

{% load crispy_forms_tags %}

{% block content %}
<div class="container text-center" style="padding-top: 130px;">
    <h2>Crear Comunidad</h2>
    <form method="POST" class="col-md-5 text-start">
        {% csrf_token %}
        {{form|crispy}}
        <button type="submit" class="btn btn-primary">Crear</button>
    </form>
</div>
{% endblock %}
