{% extends 'Vecinapp/base.html' %}
{% load static %}

{% load crispy_forms_tags %}

{% block content %}
<div class="container vh-100" style="padding-top: 130px;">
    <div class="container" style="padding: 40px; box-shadow:  0 0 10px rgba(0, 0, 0, 0.3);border-radius: 10px;">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <img src="{% static 'Vecinapp/img/fondo.jpg' %}" alt="Login" class="img-fluid" style="border-radius: 10px;">
            </div>
            <div class="col-md-5">
                <h2 class="text-center mb-3">Iniciar sesión</h2>
                <form method="POST">
                    {% csrf_token %}
                    {{form|crispy}}
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary mt-3">Iniciar sesión</button>
                    </div>
                </form>
                <div class="mt-4">
                    <a href="{% url 'password_reset' %}">Olvidaste tu contraseña?</a>
                </div>
                <div class="mt-4">
                    <p>No tienes cuenta? <a href="{% url 'autenticacion' %}">Regístrate</a></p>
                </div>
                    
            </div>
        </div>
    </div>
</div>
{% endblock %}
