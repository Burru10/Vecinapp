{% extends 'Vecinapp/base.html' %}
{% load static %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container text-center vh-100" style="padding-top: 150px;">
    <h2>Restablecer Contraseña</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Cambiar contraseña</button>
    </form>
</div>

{% endblock %}
